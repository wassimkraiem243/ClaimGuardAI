services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimguard_dev}
      POSTGRES_DB: claimguard
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard"]
      interval: 5s
      retries: 10
volumes:
  pgdata: