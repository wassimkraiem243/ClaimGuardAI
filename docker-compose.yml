services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimguard}
      POSTGRES_DB: claimguard
    ports:
      # Must match apps/api/.env DATABASE_URL (localhost:5433). Avoid 55432 on Windows (Hyper-V reserved ranges).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard"]
      interval: 5s
      retries: 10
volumes:
  pgdata: